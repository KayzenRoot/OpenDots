name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run on the same ref is wasted compute, so cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # Fast feedback first: no database needed, fails within a minute.
  quality:
    name: Quality (format, lint, types, dead code)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run check-format
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      # Knip is report-only: unused-code findings are tracked, not a merge gate.
      # See docs/knip.md.
      - name: Unused code (report only)
        run: npm run knip -- --no-exit-code --reporter github-actions
      - name: Unused code, production (report only)
        run: npm run knip:production -- --no-exit-code --reporter github-actions

  test:
    name: Tests (unit + integration, real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # A real database, because the conversation store, the agent runner and
      # the learning store only exercise themselves against PostgreSQL. Without
      # this service those suites self-skip, and the most important code in the
      # product would go untested while CI still looked green.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexbot
          POSTGRES_PASSWORD: nexbot
          POSTGRES_DB: nexbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexbot -d nexbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXBOT_TEST_DATABASE_URL: postgres://nexbot:nexbot@127.0.0.1:5432/nexbot_test
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Confirm the database suite will actually run
        run: |
          node -e "
            const { Client } = require('pg');
            const c = new Client({ connectionString: process.env.NEXBOT_TEST_DATABASE_URL });
            c.connect()
              .then(() => c.query('select 1'))
              .then(() => { console.log('PostgreSQL reachable'); return c.end(); })
              .catch((e) => { console.error('PostgreSQL unreachable:', e.message); process.exit(1); });
          "
      - name: Tests
        run: npx vitest run --reporter=default --reporter=github-actions

  build:
    name: Build (client + server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Server entrypoint exists
        run: test -f dist/server/server/index.js
      - name: Client bundle and favicon exist
        run: |
          test -n "$(ls dist/client/assets/*.js 2>/dev/null)"
          test -f dist/client/favicon.svg

  container:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only, never push: this catches a broken Dockerfile or a lockfile
      # that no longer installs cleanly, which has broken releases before.
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fail on critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Report high advisories without blocking
        run: |
          npm audit --omit=dev --audit-level=high || {
            echo "::warning::High advisories present. The accepted set is documented in docs/fork/SECURITY-AUDIT.md."
          }
