<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NexBot">
  <defs>
    <linearGradient id="nx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6" />
      <stop offset="0.55" stop-color="#6366F1" />
      <stop offset="1" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="nx-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.14" />
    </linearGradient>
    <radialGradient id="nx-glow" cx="0.28" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#nx-bg)" />
  <rect width="512" height="512" rx="116" fill="url(#nx-glow)" />
  <rect width="512" height="512" rx="116" fill="url(#nx-sheen)" />

  <!-- Geometric N: two stems joined by a diagonal, rounded caps for a soft,
       Apple-like feel. Reads at 16px. -->
  <path
    d="M172 344V168l168 176V168"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="52"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- The node: a single accent dot, the "bot" in the nexus. -->
  <circle cx="340" cy="168" r="26" fill="#C4B5FD" />
</svg>
